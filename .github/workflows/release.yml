name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build release artifact
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      # Signing is optional so a release never fails just because signing is
      # not configured. Once the four AZURE_SIGNING_* secrets exist, every
      # release is signed automatically.
      - name: Check for signing credentials
        id: signing
        shell: bash
        env:
          TENANT: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
          CLIENT: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
          SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
          ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
        run: |
          if [ -n "$TENANT" ] && [ -n "$CLIENT" ] && [ -n "$SECRET" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Azure Artifact Signing is not configured; shipping an unsigned build." >&2
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # Signs the executable *before* it is zipped, so the signature travels
      # with the binary that users actually run. Signing the archive instead
      # would leave the extracted exe unsigned and still untrusted.
      - name: Sign wmux.exe
        if: steps.signing.outputs.ready == 'true'
        uses: Azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
          # Region-specific; for example https://eus.codesigning.azure.net/
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE_NAME }}
          files: ${{ github.workspace }}\target\release\wmux.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: wmux terminal session persistence for Windows
          description-url: https://github.com/HomeOps/wmux

      - name: Verify signature
        if: steps.signing.outputs.ready == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature target\release\wmux.exe
          "Status : $($sig.Status)"
          "Signer : $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "signature is $($sig.Status), refusing to publish" }

      - name: Package
        shell: pwsh
        run: |
          $version = '${{ needs.release-please.outputs.version }}'
          $zip = "wmux-$version-x64.zip"
          Compress-Archive -Path 'target/release/wmux.exe', 'README.md', 'LICENSE' -DestinationPath $zip
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Attach to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload '${{ needs.release-please.outputs.tag_name }}' $env:ZIP --clobber

  winget:
    name: Publish to winget
    needs: [release-please, build]
    # Skipped automatically when WINGET_TOKEN is absent, so the release itself
    # never fails just because winget publishing is not set up yet.
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check for a token
        id: gate
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo "WINGET_TOKEN is not set; skipping the winget submission." >&2
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # WinGet Releaser is the community-standard publisher and is what most
      # winget-pkgs PRs are generated by. It handles forking, branching, the
      # manifest edit, and the upstream PR.
      #
      # Two constraints worth remembering:
      #   * It can only *update* a package. The very first version has to be
      #     submitted by hand with `wingetcreate new`; see CLAUDE.md.
      #   * `token` must be a **classic** PAT with `public_repo`. Fine-grained
      #     tokens do not work (winget-releaser issue #172).
      - name: Publish to winget
        if: steps.gate.outputs.ready == 'true'
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: HomeOps.wmux
          version: ${{ needs.release-please.outputs.version }}
          release-tag: ${{ needs.release-please.outputs.tag_name }}
          # The default regex matches exe/msi/msix/appx only. wmux ships a
          # portable zip, so it has to be widened or nothing is picked up.
          installers-regex: '\.zip$'
          # Account holding the winget-pkgs fork. Leave the repository variable
          # unset to use the token owner's own account.
          fork-user: ${{ vars.WINGET_FORK_USER }}
          token: ${{ secrets.WINGET_TOKEN }}
