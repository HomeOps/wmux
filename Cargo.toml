[package]
name = "wmux"
version = "0.3.1"
edition = "2021"
rust-version = "1.77"
description = "Terminal session persistence for Windows. Detach a console session, close the window, reattach later."
license = "MIT"
repository = "https://github.com/HomeOps/wmux"
homepage = "https://github.com/HomeOps/wmux"
readme = "README.md"
keywords = ["terminal", "conpty", "tmux", "windows", "session"]
categories = ["command-line-utilities"]

[lib]
name = "wmux"
path = "src/lib.rs"

[[bin]]
name = "wmux"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
portable-pty = "0.8"
vt100 = "0.15"

[build-dependencies]
# Embeds a Windows version resource and application manifest. An executable
# with no CompanyName, ProductName, or FileDescription is a strong heuristic
# signal to antivirus machine-learning models; wmux was detected as
# Trojan:Win32/Wacatac.B!ml partly on that basis.
winresource = "0.1"

[dev-dependencies]
# The end-to-end tests render the session's output stream to check what a user
# would actually see, rather than substring-matching raw VT bytes.
vt100 = "0.15"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
]

[profile.release]
# Deliberately not tuned for minimum size. `opt-level = "z"` plus a stripped
# symbol table produces a small, dense, symbol-free binary, which is exactly
# what a packed malware sample looks like to a heuristic scanner. Keeping
# symbols and normal optimisation costs a few hundred kilobytes and makes the
# binary look like what it is.
opt-level = 3
lto = true
codegen-units = 1
strip = false
